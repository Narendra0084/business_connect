name: bihar_business_connect
description: A trusted marketplace connecting Bihar sellers and buyers from discovery to delivery.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1
  firebase_messaging: ^15.0.1
  firebase_app_check:

  # Utilities
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  pin_code_fields: ^8.0.1
  equatable: ^2.0.5
  flutter_bloc: ^8.1.6
  intl: ^0.19.0
  google_fonts: ^8.2.1
  geolocator: ^14.0.3
  geocoding: ^3.0.0
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
